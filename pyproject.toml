[project]
name = "fuelrod-exporter"
version = "1.0.0"
description = "REST service for exporting large record sets with filtering and querying capabilities"
authors = [
    {name = "Munywele Sammy Barasa", email = "sammy@munywele.co.ke"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "flask-cors (>=6.0.1,<7.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "pandas (>=2.3.2,<3.0.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "click (>=8.2.1,<9.0.0)",
    "flask-openapi3[elements,rapidoc,rapipdf,redoc,scalar,swagger] (>=4.2.1,<5.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "postgres (>=4.0,<5.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "redis (>=6.4.0,<7.0.0)",
    "dramatiq[redis] (>=1.18.0,<2.0.0)",
]

[tool.poetry]
packages = [{include = "fuelrod_exporter", from = "src"}]

[tool.poetry.group.dev.dependencies]
sqlacodegen = {version = "^3.1.0", allow-prereleases = true}
pylint = "^4.0.0"
pytest = "^8.4.1"
requests = "^2.32.5"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
lint = "pylint.__main__:run"
models = "fuelrod_exporter.model_gen:main"
test = "fuelrod_exporter.main:main"
